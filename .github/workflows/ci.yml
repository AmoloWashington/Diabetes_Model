name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Backend tests (physiology, ML, API, AI loop with a fake client)
        working-directory: backend
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax check
        run: for f in frontend/js/*.js; do node --check "$f"; done
