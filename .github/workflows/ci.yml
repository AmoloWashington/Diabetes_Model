name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (physiology, RNA, datasets/Kaggle mocked, API, AI loop with fake client)
        working-directory: backend
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable image
        run: docker build -t glucolab .
      - name: Start on a platform-assigned port and check health
        run: |
          docker run -d --name glucolab -e PORT=9000 -p 9000:9000 glucolab
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:9000/api/health
          curl -fsS http://localhost:9000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs glucolab
